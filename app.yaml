# DigitalOcean App Platform Specification for ProjectMeats
# Valid specification without certificate_id field (deprecated/invalid)
name: projectmeats
region: nyc

# Services
services:
  # Django Backend API
  - name: backend
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    github:
      repo: Vacilator/ProjectMeats
      branch: main
    http_port: 8000
    instance_count: 1
    instance_size_slug: professional-xs
    environment_slug: python
    envs:
      - key: DJANGO_SETTINGS_MODULE
        value: apps.settings.production
      - key: DEBUG
        value: "False"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
    health_check:
      http_path: /health/
    routes:
      - path: /api
      - path: /admin
      - path: /health

# Static sites  
static_sites:
  # React Frontend
  - name: frontend
    source_dir: frontend
    github:
      repo: Vacilator/ProjectMeats
      branch: main
    build_command: npm run build
    output_dir: build
    index_document: index.html
    error_document: index.html
    environment_slug: node-js
    envs:
      - key: NODE_ENV
        value: production
    routes:
      - path: /

# Database
databases:
  - name: projectmeats-db
    engine: PG
    version: "15"
    size: db-s-dev-database

# Jobs
jobs:
  - name: migrate
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    github:
      repo: Vacilator/ProjectMeats
      branch: main
    run_command: python manage.py migrate
    environment_slug: python
    instance_size_slug: basic-xxs
    kind: PRE_DEPLOY

  - name: collectstatic
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    github:
      repo: Vacilator/ProjectMeats
      branch: main
    run_command: python manage.py collectstatic --noinput
    environment_slug: python
    instance_size_slug: basic-xxs
    kind: PRE_DEPLOY